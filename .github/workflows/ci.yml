name: Deploy

# Production: git pull → migrate → clear cache.
# Pull requests are not deployed; use normal Git review/merge SOPs.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull, migrate, clear cache
    runs-on: ubuntu-latest

    steps:
      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub secret: $key"
              missing=1
            else
              echo "OK: $key is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add these repository secrets (Settings → Secrets and variables → Actions):"
            echo "  DEPLOY_HOST  – VPS IP or hostname"
            echo "  DEPLOY_USER  – SSH username"
            echo "  DEPLOY_SSH_KEY – private key (full PEM, including BEGIN/END lines)"
            echo "  DEPLOY_SSH_PASSPHRASE – required if the private key is encrypted"
            echo "  DEPLOY_PATH  – absolute path to the app on the server (e.g. /var/www/hrms)"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "==> Pulling latest code"
            git fetch --all --prune
            git checkout "${{ github.ref_name }}"
            git pull --ff-only origin "${{ github.ref_name }}"

            echo "==> Running migrations"
            php artisan migrate --force --no-interaction

            echo "==> Clearing caches"
            php artisan optimize:clear

            echo "==> Deploy complete"
