name: Deploy

# Production: git pull → migrate → clear cache.
# Pull requests are not deployed; use normal Git review/merge SOPs.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull, migrate, clear cache
    runs-on: ubuntu-latest

    steps:
      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_GIT_TOKEN: ${{ secrets.DEPLOY_GIT_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_GIT_TOKEN DEPLOY_PATH; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub secret: $key"
              missing=1
            else
              echo "OK: $key is set"
            fi
          done
          if [ -z "$DEPLOY_SSH_PASSPHRASE" ]; then
            echo "NOTE: DEPLOY_SSH_PASSPHRASE is empty (OK only if the private key has no passphrase)"
          else
            echo "OK: DEPLOY_SSH_PASSPHRASE is set"
          fi
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add these repository secrets (Settings → Secrets and variables → Actions):"
            echo "  DEPLOY_HOST  – VPS IP or hostname"
            echo "  DEPLOY_USER  – SSH username"
            echo "  DEPLOY_SSH_KEY – private key (full PEM, including BEGIN/END lines)"
            echo "  DEPLOY_SSH_PASSPHRASE – required if the private key is encrypted"
            echo "  DEPLOY_GIT_TOKEN – GitHub PAT with repo read access (for git pull on the VPS)"
            echo "  DEPLOY_PATH  – absolute path to the app on the server (e.g. /var/www/hrms)"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            REPO="${{ github.repository }}"
            CLEAN_ORIGIN="https://github.com/${REPO}.git"
            AUTH_ORIGIN="https://x-access-token:${{ secrets.DEPLOY_GIT_TOKEN }}@github.com/${REPO}.git"

            echo "==> Pulling latest code"
            git remote set-url origin "$AUTH_ORIGIN"
            git fetch --all --prune
            git checkout "${{ github.ref_name }}"
            # Discard local changes to tracked runtime files (e.g. laravel.log) before sync
            git reset --hard "origin/${{ github.ref_name }}"
            git remote set-url origin "$CLEAN_ORIGIN"

            echo "==> Running migrations"
            php artisan migrate --force --no-interaction

            echo "==> Syncing roles & permissions"
            php artisan db:seed --class=LandingPageSeeder --force --no-interaction
            php artisan db:seed --class=RolesAndPermissionsSeeder --force --no-interaction
            php artisan db:seed --class=CmsUserSeeder --force --no-interaction
            echo "==> Clearing caches"
            php artisan optimize:clear

            echo "==> Deploy complete"
